<!DOCTYPE html>
<html lang="en">
<head>
<title></title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/vite.svg" />
<script type="module" src="./main.js"></script>
<style>

    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
    }

    @media (orientation: landscape) {

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 100vh;
        }

        /* #footer {
            display: none;
        } */

        #wc-pane {
            min-width: var(--min-w, 20%); ;
            height: auto;
            position: absolute;
                top: 0px;
                left: 0px;
        }

    }

    @media (orientation: portrait) {

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 80vh 20vh;
        }

        #footer {
            display: block; /* Hide sidebar if screen is too narrow/tall */
        }

        #wc-pane {
            min-width: 100%;
            height: 100%;
            position: relative;
                top: 0px;
                left: 0px;
        }

    }
    
</style>
</head>
<body>
    <div class="grid">
        <section id="header" class="panel"></section>
        <section id="footer" class="panel"></section>
    </div>
</body>
</html>
